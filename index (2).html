<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Margaret Hamilton e a Apollo 11 | Ciência Delas</title>
<meta name="theme-color" content="#10303a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🚀%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#10303a;--bg2:#0b2229;--tx:#f3efe4;--mut:#a9bcc0;--cu:#F2B705;--red:#ee5a48;--ok:#6fcf97;--line:#2b5662}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Source Serif 4",Georgia,serif;overflow:hidden}
h1,h2,.ui{font-family:"Archivo",system-ui,sans-serif}
#deck{height:100%;position:relative}
.slide{position:absolute;inset:0;display:none;padding:6vh 7vw 12vh;overflow-y:auto}
.slide.on{display:flex;flex-direction:column;justify-content:center;gap:3vh;animation:in .35s ease}
@keyframes in{from{opacity:0}to{opacity:1}}
.body{display:grid;grid-template-columns:1fr;gap:4vw;align-items:center}
.body.has-media{grid-template-columns:1.1fr 1fr}
h1{font-size:clamp(2.4rem,7vw,6rem);line-height:1;margin:0;font-weight:900;letter-spacing:-.02em}
h2{font-size:clamp(1.8rem,4.6vw,3.6rem);line-height:1.08;margin:0;font-weight:900}
.txt p{font-size:clamp(1.25rem,2.6vw,2.1rem);line-height:1.4;margin:0 0 .8em;max-width:34em}
.quote{font-size:clamp(1.4rem,3vw,2.4rem);font-style:italic;border-left:6px solid var(--cu);padding-left:1.2rem;margin-top:1rem;max-width:30em}
.date{font-family:"Archivo",sans-serif;color:var(--cu);font-weight:700;font-size:clamp(1rem,1.8vw,1.4rem)}
figure{margin:0}
.media img{width:100%;max-height:62vh;object-fit:contain;border:1px solid var(--line);background:var(--bg2)}
.media figcaption{font-size:.85rem;color:var(--mut);margin-top:.5rem;font-family:"Archivo",sans-serif}
.ph{aspect-ratio:4/3;border:2px dashed var(--line);display:grid;place-items:center;text-align:center;padding:1rem;color:var(--mut);font-family:"Archivo",sans-serif;background:var(--bg2)}
.ph b{color:var(--cu);display:block;font-size:1.1rem;word-break:break-all}
/* nav */
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:1rem;padding:1.2vh 4vw;background:var(--bg2);border-top:1px solid var(--line)}
#prog{flex:1;height:6px;background:var(--line)}
#prog i{display:block;height:100%;width:0;background:var(--cu);transition:width .3s}
button{font-family:"Archivo",sans-serif;font-weight:700;font-size:1.05rem;color:var(--tx);background:transparent;border:2px solid var(--cu);padding:.6rem 1.2rem;border-radius:4px;cursor:pointer}
button:hover:not(:disabled){background:var(--cu);color:var(--bg2)}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,.card:focus-visible,.slot:focus-visible{outline:3px solid var(--tx);outline-offset:2px}
#cnt{font-family:"Archivo",sans-serif;color:var(--mut);min-width:4.5rem;text-align:center}
.hint{font-family:"Archivo",sans-serif;color:var(--mut);font-size:.95rem}
/* game */
.game{display:grid;grid-template-columns:1fr 1fr;gap:2vw;max-width:60rem}
.panel{border:1px solid var(--line);background:var(--bg2);padding:1rem;min-height:14rem}
.panel h3{margin:0 0 .8rem;font-family:"Archivo",sans-serif;font-size:1rem;color:var(--mut)}
.card{display:block;width:100%;margin-bottom:.7rem;padding:1rem;background:var(--bg);border:2px solid var(--line);font-family:"Archivo",sans-serif;font-weight:700;font-size:1.15rem;cursor:grab;user-select:none;text-align:left;color:var(--tx)}
.card small{display:block;font-weight:400;color:var(--mut);margin-top:.2rem}
.card.sel{border-color:var(--cu)}
.card.bad{animation:sh .4s;border-color:var(--red)}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.slot{display:grid;place-items:center;min-height:9rem;border:3px dashed var(--cu);color:var(--cu);font-family:"Archivo",sans-serif;font-weight:700;text-align:center;padding:.6rem;cursor:pointer}
.slot.over{background:#1c4b58}
.slot.full{border-style:solid;border-color:var(--ok);color:var(--ok)}
.alarm{display:inline-block;font-family:"Archivo",sans-serif;font-weight:900;font-size:clamp(3rem,10vw,8rem);color:var(--red);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}
.fb{font-family:"Archivo",sans-serif;font-size:1.15rem;min-height:1.6em}
.fb.ok{color:var(--ok)}.fb.no{color:var(--red)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.8rem;max-width:60rem}
.opts .card{cursor:pointer}
.opts .card[aria-pressed=true]{border-color:var(--ok);background:#17454a}
.note{font-size:.9rem;color:var(--mut);max-width:44rem}
@media(max-width:800px){.body.has-media,.game{grid-template-columns:1fr}.slide{padding:4vh 6vw 14vh}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== melhorias visuais ===== */
body{background:radial-gradient(ellipse at 12% 0,#1c4a59 0,var(--bg) 42%,var(--bg2) 100%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff8,transparent),radial-gradient(1px 1px at 90px 120px,#fff6,transparent),radial-gradient(1.5px 1.5px at 160px 60px,#fff5,transparent);background-size:210px 210px}
#deck,#bar{position:relative;z-index:1}#bar{position:fixed}
.slide.on{justify-content:safe center}
.slide.on .body{animation:up .7s cubic-bezier(.2,.7,.2,1) .1s both}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
#s1 h2{font-size:clamp(3rem,10vw,8rem)}
#s1 h1::after{content:"";display:block;width:6rem;height:7px;background:var(--cu);margin-top:1.4rem}
.date::before{content:"";display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--cu);margin-right:.6em}
.quote{background:linear-gradient(90deg,#F2B70522,transparent 80%);padding:.8rem 1.2rem}
.media img{border:1px solid var(--cu);border-radius:6px;box-shadow:12px 12px 0 #0b2229,0 20px 50px #0008}
.alarm{text-shadow:0 0 36px #ee5a489a}
.card{transition:transform .15s,border-color .15s,background .15s}
.card:hover{transform:translateY(-2px);border-color:var(--cu)}
.slot:not(.full){animation:pu 2.2s ease-in-out infinite}
@keyframes pu{50%{background:#1c4b5877}}
#prog{border-radius:4px;overflow:hidden}
button{transition:background .15s,color .15s}

/* ===== paleta com significado (roxo, dourado, verde, branco) + novas áreas ===== */
:root{--rox2:#5B2A86}
body{display:flex;flex-direction:column}
#deck{flex:1;height:auto;min-height:0}
#inicio h1{font-size:clamp(3rem,10vw,8rem)}
#inicio h1::after{content:"";display:block;width:6rem;height:7px;background:linear-gradient(90deg,var(--rox2),var(--cu));margin-top:1.4rem}
#prog i{background:linear-gradient(90deg,var(--rox2),var(--cu))}
#fatos{display:flex;gap:.6rem;align-items:center;padding:.5rem 4vw;background:var(--rox2);color:#fff;font-size:.9rem;border-bottom:3px solid var(--cu);font-family:Archivo,sans-serif;position:relative;z-index:2}
#fatos span{flex:1;line-height:1.3}
#fatos button{padding:.25rem .7rem;font-size:.85rem;border-width:1px}
.sel{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.8rem;max-width:56rem}
.scard{display:flex;flex-direction:column;gap:.3rem;padding:1rem;border:2px solid var(--line);border-radius:0;background:var(--bg2);color:var(--tx);font-size:1.1rem;text-align:left}
.scard span{font-size:2rem}.scard small{color:var(--mut);font-weight:400}
.scard.on{border-color:var(--cu);cursor:pointer;box-shadow:6px 6px 0 var(--rox2)}
.scard.off{opacity:.5;border-style:dashed}
.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.6rem;min-height:5.5rem;max-width:60rem}
.task{position:relative;overflow:hidden;border:0;border-radius:6px;padding:.8rem .8rem 1rem;color:#fff;text-align:left;font-size:1.05rem}
.task small{display:block;font-weight:400}.task i{position:absolute;left:0;bottom:0;height:6px;background:#fff;opacity:.85}
.p3,.p3:hover:not(:disabled){background:var(--rox2);color:#fff}.p2,.p2:hover:not(:disabled){background:var(--cu);color:#10303a}.p2 i{background:#10303a}.p1,.p1:hover:not(:disabled){background:#2E8B57;color:#fff}
.task:hover{filter:brightness(1.15)}
.load{height:10px;max-width:60rem;background:var(--line);border-radius:5px;overflow:hidden}.load i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
.fm{display:grid;gap:.6rem;max-width:36rem;font-family:Archivo,sans-serif}.fm label{display:grid;gap:.3rem;font-weight:700}
.fm input,.fm select,.fm textarea{padding:.7rem;border:2px solid var(--line);border-radius:6px;background:var(--bg2);color:var(--tx);font:inherit;font-weight:400}
.fm button{justify-self:start}
</style>
</head>
<body>
<div id="fatos" role="region" aria-label="Fato curioso do dia"><b>Fato do dia:</b><span id="fato-txt"></span><button id="fato-next" aria-label="Ver outro fato">↻</button><button data-j="inicio">Início</button><button data-j="feedback">Sugestões</button></div>
<main id="deck"></main>
<nav id="bar" class="ui" aria-label="Navegação">
  <button id="prev" aria-label="Slide anterior">Voltar</button>
  <div id="prog"><i></i></div>
  <span id="cnt"></span>
  <button id="next" aria-label="Próximo slide">Avançar</button>
</nav>

<script src="fatos.js"></script>
<script>
/* ===== COMO EDITAR =====
 Cada slide é um objeto em SLIDES.
 media: { src:"assets/arquivo.jpg", alt:"descrição", credit:"Fonte / licença" }
 Aceita .jpg .png .webp e .gif (basta colocar o arquivo na pasta assets/).
 Se o arquivo não existir, aparece um espaço reservado com o nome esperado.
 game: "memoria" (arrastar bloco) | "reflexao" (escolher boas práticas)
*/
const SLIDES = [
 {id:"inicio", title:"Ciência Delas", select:true,
  text:["Mulheres não só enfrentaram barreiras: elas criaram tecnologia. Aqui você conhece o que elas construíram e depois joga para entender como funciona.","Escolha uma história para começar."]},
 {id:"s1", title:"Antes de chegar à Lua", date:"1969",
  text:["A humanidade vai tentar levar astronautas até a Lua e trazê-los de volta em segurança.","Além dos foguetes e dos motores, existe outro elemento essencial: o software."],
  quote:"Uma missão espacial também depende de decisões tomadas em linhas de código.",
  media:{src:"assets/saturn-v.svg",alt:"Foguete Saturn V na plataforma de lançamento",credit:"Ilustração original do projeto"}},
 {id:"s2", title:"Quem é Margaret Hamilton?",
  text:["Pioneira da engenharia de software, ela liderou uma equipe do MIT Instrumentation Laboratory que desenvolveu o software de voo da Apollo.","O trabalho não era só fazer o computador executar instruções. Era pensar no que poderia dar errado."],
  quote:"Um bom sistema precisa ser pensado também para os momentos em que algo dá errado.",
  media:{src:"assets/margaret-hamilton.svg",alt:"Programadora ao lado de uma pilha de listagens de código de voo",credit:"Ilustração original do projeto"}},
 {id:"s3", title:"E se algo der errado?",
  text:["E se uma pessoa cometesse um erro?","E se o computador ficasse sobrecarregado?","E se várias tarefas precisassem de atenção ao mesmo tempo?"],
  quote:"Hamilton defendia antecipar problemas, documentar riscos e criar sistemas capazes de lidar com o inesperado.",
  media:{src:"assets/codigo-apollo.svg",alt:"Documentos de programação da época",credit:"Ilustração original do projeto"}},
 {id:"s4", title:"A descida começa", date:"20 de julho de 1969",
  text:["O módulo lunar Eagle desce rumo à Lua com Neil Armstrong e Buzz Aldrin.","O computador de orientação precisa executar tarefas importantes. De repente, surgem alarmes."],
  alarm:"1202",
  media:{src:"assets/eagle-descida.svg",alt:"Animação do módulo lunar Eagle em descida",credit:"Ilustração original do projeto"}},
 {id:"s5", title:"O computador está sobrecarregado",
  text:["O alarme 1202 indica sobrecarga de recursos. Pouco depois, surge também o 1201.","Não quer dizer que o computador parou. Quer dizer que ele não consegue atender a todas as solicitações ao mesmo tempo."],
  quote:"Recursos limitados. Tarefas concorrentes. Tempo crítico."},
 {id:"s6", title:"Sua vez: libere a memória", game:"memoria"},
 {id:"s7", title:"A decisão em solo",
  text:["Na sala de controle, a equipe interpreta os alarmes rapidamente.","Os especialistas reconhecem a sobrecarga e sabem que o software foi projetado para preservar as tarefas prioritárias e se recuperar.","A equipe autoriza a continuidade da descida."],
  quote:"A equipe precisa compreender o que o sistema está dizendo antes de decidir o próximo passo.",
  media:{src:"assets/sala-de-controle.svg",alt:"Sala de controle da missão",credit:"Ilustração original do projeto"}},
 {id:"s8", title:"A Lua", date:"20 de julho de 1969",
  text:["O Eagle pousa. O computador continuou executando as funções essenciais da descida.","O sucesso dependeu de muitas pessoas: astronautas, engenheiros, programadores, técnicos e equipes de controle."],
  quote:"Uma conquista histórica também é resultado de planejamento, colaboração e engenharia.",
  media:{src:"assets/eagle-na-lua.svg",alt:"Módulo lunar na superfície da Lua",credit:"Ilustração original do projeto"}},
 {id:"s9", title:"O que aprendemos com Margaret?", game:"reflexao",
  text:["Computação vai além de escrever código: é entender o problema, prever o inesperado, testar e trabalhar em equipe."]},
 {id:"missao", title:"Missão Apollo 11: assuma o comando", game:"missao",
  text:["Agora você é o computador de bordo. Execute as tarefas antes que o tempo acabe: roxo é prioridade alta, dourado é média e verde é baixa. Mais de 6 tarefas ao mesmo tempo causam o alarme 1202."]},
 {id:"s10", title:"Missão concluída",
  text:["Não existe tecnologia confiável por acaso. Ela é construída por pessoas que fazem perguntas, testam ideias e se preparam para o inesperado."],
  note:"Nota histórica: as cenas interativas e os diálogos são dramatizações educativas. Não são citações literais de Margaret Hamilton nem reproduções exatas do software Apollo. Cores do projeto: roxo e verde lembram o movimento sufragista, branco lembra a igualdade e dourado, as conquistas. Fontes: NASA Apollo 11 Lunar Surface Journal (alarmes 1201/1202), perfil de Margaret Hamilton na NASA, We Hack the Moon."},
 {id:"feedback", title:"Sugestões e feedback", form:true,
  text:["Quer ver outra cientista aqui? Achou algo para melhorar? Conte para a gente."]}
];

const deck=document.getElementById("deck"),prev=document.getElementById("prev"),next=document.getElementById("next"),cnt=document.getElementById("cnt"),bar=document.querySelector("#prog i");
const done={}; let cur=0;
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};

function mediaEl(m){
  const f=el("figure","media");
  const img=new Image();img.src=m.src;img.alt=m.alt;
  img.onerror=()=>{f.innerHTML="";const p=el("div","ph",`<div>Coloque a imagem em<b>${m.src}</b>${m.alt}</div>`);f.append(p,cap())};
  const cap=()=>el("figcaption","",m.credit?"Crédito: "+m.credit:"");
  f.append(img,cap());return f;
}

function memoriaGame(s,sec){
  const g=el("div","game"),L=el("div","panel","<h3>Tarefas disputando espaço</h3>"),R=el("div","panel","<h3>Memória do computador (cabe só uma)</h3>");
  const cards=[
   {k:1,t:"Orientação e controle",d:"Mantém a descida sob controle"},
   {k:0,t:"Atualizar informações",d:"Pode esperar sem risco"},
   {k:0,t:"Recalcular dados antigos",d:"Pode esperar sem risco"}];
  const slot=el("div","slot","Arraste a tarefa essencial para cá");slot.tabIndex=0;slot.setAttribute("role","button");
  const fb=el("p","fb");let sel=null;
  const place=c=>{
    if(c.k){slot.className="slot full";slot.textContent="Em execução: "+c.t;fb.className="fb ok";
      fb.textContent="Correto! Sistemas de tempo real tratam as tarefas por prioridade. O que é essencial continua; o que pode esperar fica para depois.";
      L.querySelectorAll(".card").forEach(x=>x.draggable=false);done[s.id]=1;sync();
    }else{fb.className="fb no";fb.textContent="Essa tarefa pode esperar. Se ela ocupar a memória, as funções de controle ficam sem recurso. Tente outra.";c.el.classList.add("bad");setTimeout(()=>c.el.classList.remove("bad"),450)}
  };
  cards.forEach(c=>{
    const b=el("button","card",`${c.t}<small>${c.d}</small>`);b.draggable=true;c.el=b;
    b.ondragstart=e=>{e.dataTransfer.setData("text","x");sel=c};
    b.onclick=()=>{if(done[s.id])return;sel=c;L.querySelectorAll(".card").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");fb.className="fb";fb.textContent="Agora toque na memória para colocar a tarefa."};
    L.append(b)});
  slot.ondragover=e=>{e.preventDefault();slot.classList.add("over")};
  slot.ondragleave=()=>slot.classList.remove("over");
  slot.ondrop=e=>{e.preventDefault();slot.classList.remove("over");if(sel&&!done[s.id])place(sel)};
  slot.onclick=()=>{if(sel&&!done[s.id])place(sel)};
  slot.onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&sel&&!done[s.id]){e.preventDefault();place(sel)}};
  R.append(slot);g.append(L,R);
  sec.append(g,fb,el("p","note","Simplificação criada para o jogo: os cartões não representam a lista exata das tarefas internas do computador Apollo."));
  if(!done[s.id])sec.append(el("p","hint","Arraste com o mouse, ou toque na tarefa e depois na memória."));
}

function reflexaoGame(s,sec){
  const o=el("div","opts"),fb=el("p","fb","Escolha ao menos uma. Para avançar, marque duas ou mais.");
  ["Testaria situações de erro.","Validaria comandos e dados.","Definiria quais tarefas são essenciais.","Criaria mecanismos de recuperação."].forEach(t=>{
    const b=el("button","card",t);b.setAttribute("aria-pressed","false");
    b.onclick=()=>{b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")==="true"?"false":"true");
      const n=o.querySelectorAll("[aria-pressed=true]").length;
      if(n>=2){done[s.id]=1;fb.className="fb ok";fb.textContent="Boa! Todas essas práticas aparecem na história de Hamilton.";sync()}};
    o.append(b)});
  sec.append(el("p","quote","Se você estivesse desenvolvendo um sistema importante, o que faria para prepará-lo para o inesperado?"),o,fb);
}


let mIv;
function selecao(s,sec){
 const g=el("div","sel");
 [["👩‍💻","Margaret Hamilton","Software da Apollo 11",1],["🔢","Ada Lovelace","Em breve"],["⚓","Grace Hopper","Em breve"],["📡","Hedy Lamarr","Em breve"]].forEach(([e,n,d,on])=>{
  const c=el(on?"button":"div","scard"+(on?" on":" off"),`<span aria-hidden="true">${e}</span><b>${n}</b><small>${d}</small>`);
  if(on)c.onclick=()=>go(1);g.append(c)});
 sec.append(g);
}
function missaoGame(s,sec){
 const T=[["Pouso",3],["Motores",3],["Radar",2],["Navegação",2],["Rádio",1],["Painel",1]],N=["","Baixa","Média","Alta"],P=[0,2,5,10],D=40;
 const hud=el("p","fb"),load=el("div","load","<i></i>"),q=el("div","queue"),fb=el("p","fb","Complete uma rodada para avançar."),lab=el("label","hint",'<input type="checkbox" checked> Proteção de Hamilton (descarta tarefas leves na sobrecarga)'),ini=el("button","","Iniciar missão");
 let st={sc:0,t:D,l:3,q:[],sp:0,over:1},id=0;
 const bars=()=>{st.q.forEach(t=>{const b=q.querySelector(`[data-id="${t.id}"] i`);if(b)b.style.width=t.ttl/t.max*100+"%"});hud.textContent=`Pontos: ${st.sc}   Tempo: ${Math.ceil(Math.max(0,st.t))}s   Vidas: ${"❤".repeat(Math.max(0,st.l))||0}`;load.firstChild.style.width=Math.min(100,st.q.length/6*100)+"%"};
 const draw=()=>{q.innerHTML=st.q.map(t=>`<button class="task p${t.p}" data-id="${t.id}"><b>${t.n}</b><small>${N[t.p]}</small><i></i></button>`).join("");bars()};
 const end=(ok,m)=>{clearInterval(mIv);st.over=1;ini.disabled=false;ini.textContent="Jogar de novo";fb.className="fb "+(ok?"ok":"no");fb.textContent=(ok?"Pouso concluído! ":"Missão perdida. ")+m+` Pontos: ${st.sc}.`;done[s.id]=1;sync()};
 const tick=()=>{st.t-=.1;st.sp-=.1;let ch=0;st.q.forEach(t=>t.ttl-=.1);
  st.q=st.q.filter(t=>{if(t.ttl>0)return 1;ch=1;if(t.p==3){st.l--;fb.className="fb no";fb.textContent=`“${t.n}” expirou! Você perdeu uma vida.`}else st.sc=Math.max(0,st.sc-1);return 0});
  if(st.sp<=0){const [n,p]=T[Math.random()*T.length|0],m=p==3?6:p==2?7:8;st.q.push({id:++id,n,p,ttl:m,max:m});st.sp=Math.max(.45,1.3-(D-st.t)/50);ch=1}
  if(st.q.length>6){ch=1;if(lab.firstChild.checked){st.q=st.q.filter(t=>t.p>1);fb.className="fb ok";fb.textContent="Alarme 1202! A proteção descartou as tarefas leves e o pouso continua."}else st.l=0}
  ch?draw():bars();
  if(st.l<=0)return end(0,lab.firstChild.checked?"Tarefas críticas demais expiraram.":"Sem a proteção de Hamilton, a sobrecarga travou o sistema.");
  if(st.t<=0)end(1,"Descartar o menos importante e proteger o essencial foi o que ajudou a salvar a Apollo 11.")};
 q.onclick=e=>{const b=e.target.closest(".task");if(!b||st.over)return;const t=st.q.find(x=>x.id==b.dataset.id);if(!t)return;st.sc+=P[t.p];st.q=st.q.filter(x=>x!==t);draw()};
 ini.onclick=()=>{st={sc:0,t:D,l:3,q:[],sp:0};ini.disabled=true;fb.className="fb";fb.textContent="Vai! Comece pelas roxas.";draw();clearInterval(mIv);mIv=setInterval(tick,100)};
 bars();sec.append(hud,load,q,fb,lab,ini);
}
function formulario(sec){
 const f=el("form","fm",'<label>Nome (opcional)<input name="nome" autocomplete="name"></label><label>Tipo<select name="tipo"><option>Sugestão de cientista</option><option>Feedback do site</option><option>Outro</option></select></label><label>Mensagem<textarea name="mensagem" rows="4" required></textarea></label><button type="submit">Enviar mensagem</button><p class="fb" role="status"></p>');
 f.action="https://formspree.io/f/SEU_ID_AQUI";f.method="POST"; /* troque SEU_ID_AQUI pelo ID do Formspree */
 f.onsubmit=async e=>{e.preventDefault();const m=f.querySelector(".fb"),ok=()=>{m.className="fb ok";m.textContent="Obrigada! Sua mensagem foi enviada.";f.reset()},no=t=>{m.className="fb no";m.textContent=t};
  if(!f.mensagem.value.trim())return no("Escreva uma mensagem antes de enviar.");
  if(f.action.includes("SEU_ID_AQUI"))return ok();
  try{const r=await fetch(f.action,{method:"POST",body:new FormData(f),headers:{Accept:"application/json"}});r.ok?ok():no("Não foi possível enviar. Tente de novo.")}catch{no("Sem conexão. Tente de novo.")}};
 sec.append(f);
}

SLIDES.forEach((s,i)=>{
  const sec=el("section","slide");sec.id=s.id;sec.setAttribute("aria-label",s.title);
  if(s.date)sec.append(el("div","date",s.date));
  sec.append(el(i===0?"h1":"h2","",s.title));
  if(s.alarm)sec.append(el("div","alarm",s.alarm));
  const body=el("div","body"+(s.media?" has-media":""));
  const tx=el("div","txt");(s.text||[]).forEach(p=>tx.append(el("p","",p)));
  if(s.quote)tx.append(el("p","quote",s.quote));
  if(s.note)tx.append(el("p","note",s.note));
  if(tx.children.length)body.append(tx);
  if(s.media)body.append(mediaEl(s.media));
  if(body.children.length)sec.append(body);
  if(s.game==="memoria")memoriaGame(s,sec);
  if(s.game==="reflexao")reflexaoGame(s,sec);
  if(s.select)selecao(s,sec);if(s.game==="missao")missaoGame(s,sec);if(s.form)formulario(sec);
  deck.append(sec);
});

const secs=[...deck.children];
function sync(){
  const s=SLIDES[cur];
  secs.forEach((e,i)=>e.classList.toggle("on",i===cur));
  cnt.textContent=(cur+1)+" / "+SLIDES.length;
  bar.style.width=((cur+1)/SLIDES.length*100)+"%";
  prev.disabled=cur===0;
  const locked=s.game&&!done[s.id];
  next.disabled=cur===SLIDES.length-1||locked;
  next.textContent=SLIDES[cur+1]&&SLIDES[cur+1].id==="s10"?"Concluir":"Avançar";if(s.game!=="missao")clearInterval(mIv);next.title=locked?"Complete a atividade para avançar":"";
  if(location.hash!=="#"+s.id)history.replaceState(null,"","#"+s.id);
}
function go(n){if(n<0||n>=SLIDES.length)return;if(n>cur&&next.disabled)return;cur=n;sync();secs[cur].scrollTop=0}
prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);
addEventListener("keydown",e=>{if(e.target.matches("input,textarea,select"))return;if(e.key==="ArrowRight"||e.key==="PageDown")go(cur+1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(cur-1)});
let fi=Math.floor(Date.now()/864e5)%FATOS.length;const ft=document.getElementById("fato-txt"),sf=()=>ft.textContent=FATOS[fi];
document.getElementById("fato-next").onclick=()=>{fi=(fi+1)%FATOS.length;sf()};sf();
document.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{cur=SLIDES.findIndex(x=>x.id===b.dataset.j);sync();secs[cur].scrollTop=0});
const h=SLIDES.findIndex(s=>"#"+s.id===location.hash);
cur=h>0&&!SLIDES.slice(0,h).some(s=>s.game)?h:0;sync();
</script>
